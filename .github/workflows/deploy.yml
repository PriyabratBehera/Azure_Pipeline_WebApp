name: Build and Deploy to Azure

on:
  push:
    branches:
      - main

env:
  ACR_LOGIN_SERVER: containerregistrypriyabrat.azurecr.io
  IMAGE_NAME: azure-devops-demo-app
  APP_SERVICE_NAME: priyabratwebapp
  RESOURCE_GROUP: rg-priyabratresource

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Login to Azure Container Registry
      - name: Login to ACR
        run: |
          az acr login --name ContainerRegistryPriyabrat

      # 4. Create image tag
      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:latest \
            .

      # 6. Push Docker image
      - name: Push Docker image
        run: |
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:latest

      # 7. Deploy image to Azure App Service
      - name: Deploy to Azure App Service
        run: |
          az webapp config container set \
            --name $APP_SERVICE_NAME \
            --resource-group $RESOURCE_GROUP \
            --container-image-name $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG

      # 8. Restart App Service
      - name: Restart App Service
        run: |
          az webapp restart \
            --name $APP_SERVICE_NAME \
            --resource-group $RESOURCE_GROUP

      # 9. Deployment completed
      - name: Deployment completed
        run: |
          echo "======================================"
          echo "Deployment completed successfully"
          echo "Image: $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"
          echo "======================================"